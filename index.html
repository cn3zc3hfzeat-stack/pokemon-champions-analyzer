  <title>対戦ノート | 個人用バトル分析</title>
  <style>
    :root{color-scheme:light;--bg:#f4f6fb;--ink:#192540;--muted:#6b7690;--line:#dde4ef;--nav:#111d35;--accent:#6556e8;--accent-soft:#eeebff;--green:#0a9275;--red:#cc5366;--card:#fff;--shadow:0 8px 28px rgba(23,39,79,.06)}
    *{box-sizing:border-box}html{font-size:15px;-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.5}
    button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:var(--accent)}
    .app{min-height:100svh;display:grid;grid-template-columns:234px minmax(0,1fr)}aside{background:var(--nav);color:#fff;padding:26px 15px;display:flex;flex-direction:column;gap:27px} .brand{padding:0 12px}.eyebrow{color:#9eaac7;font-size:.7rem;letter-spacing:.13em;font-weight:800}.brand strong{font-size:1.52rem;display:block;margin-top:3px;letter-spacing:.025em}.brand small{font-size:.78rem;color:#adb8d4}.nav{display:flex;flex-direction:column;gap:6px}.nav button{background:transparent;border:0;color:#acb8d2;text-align:left;padding:12px 14px;border-radius:12px;font-weight:700;display:flex;gap:12px;align-items:center}.nav button.active{background:#2b355d;color:#fff}.nav button:hover{background:#263350;color:#fff}.nav .symbol{width:22px;text-align:center;font-size:1.16rem}.side-note{color:#aab6d0;font-size:.75rem;padding:13px;border:1px solid #34405c;border-radius:12px;margin-top:auto}main{min-width:0;max-width:1380px;width:100%;padding:35px clamp(18px,3.5vw,56px) 65px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:start;gap:15px;margin-bottom:26px}.top h1{margin:4px 0 6px;font-size:clamp(1.45rem,2vw,2rem);letter-spacing:-.025em}.top p{margin:0;color:var(--muted)}.top-tag{background:#e4f4ef;color:#128269;padding:7px 12px;font-size:.76rem;font-weight:800;border-radius:100px;white-space:nowrap}
    .grid{display:grid;gap:17px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.two{grid-template-columns:1.1fr 1fr}.card{background:var(--card);border:1px solid #e7eaf3;border-radius:18px;padding:21px;box-shadow:var(--shadow);min-width:0}.card h2{font-size:1.08rem;margin:0 0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.stat-label{color:var(--muted);font-size:.83rem;font-weight:650}.stat-value{font-size:2rem;font-weight:800;margin:9px 0 3px;letter-spacing:-.055em}.stat-foot{font-size:.76rem;color:var(--muted)}.pill{font-size:.7rem;border-radius:30px;padding:4px 9px;background:#eef1f7;color:#586781;font-weight:800}.win{background:#e7f7f1;color:#0b876e}.loss{background:#fdeef0;color:#b94859}
    .button{background:var(--accent);color:white;border:1px solid var(--accent);padding:11px 16px;border-radius:11px;font-weight:800}.button.secondary{background:white;color:var(--ink);border-color:var(--line)}.button.ghost{background:#f3f5fb;color:var(--ink);border-color:transparent}.button.danger{color:#bd394c;border-color:#f6d5dc;background:#fff5f7}.button.small{padding:7px 10px;font-size:.78rem}.button:focus-visible,.nav button:focus-visible,.pick:focus-visible{outline:3px solid #b1a6ff;outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:9px}.line{height:1px;background:var(--line);margin:17px 0}.muted{color:var(--muted)}.small{font-size:.81rem}.section-intro{margin:-7px 0 18px;color:var(--muted);font-size:.88rem}
    label.field{display:flex;flex-direction:column;gap:6px;color:var(--ink);font-size:.81rem;font-weight:800}.field input,.field select,.field textarea,input.generic,select.generic{width:100%;background:#fff;border:1px solid #d8dfeb;border-radius:10px;padding:11px 12px;color:var(--ink);font-weight:500;outline:none;min-height:44px}.field input:focus,.field textarea:focus,.field select:focus{border-color:#8e80ed;box-shadow:0 0 0 3px #e9e6ff}.field textarea{resize:vertical;min-height:83px}.field input::placeholder{color:#a4adbe}.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.group-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;font-size:.91rem;margin-bottom:9px}.help{color:var(--muted);font-size:.77rem;margin:5px 0 12px}.pick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.pick{min-height:69px;border-radius:12px;border:1px solid var(--line);background:white;color:var(--ink);padding:10px;display:flex;flex-direction:column;align-items:start;justify-content:center;text-align:left;gap:3px;font-size:.83rem;font-weight:750;overflow-wrap:anywhere}.pick.selected{border:2px solid var(--accent);background:var(--accent-soft);padding:9px}.pick:disabled{opacity:.45}.pick .index{font-size:.68rem;color:var(--muted)}.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{border-radius:12px;border:1px solid var(--line);padding:15px;background:#fff;font-weight:800;display:flex;gap:9px;align-items:center;justify-content:center}.choice.selected.win-choice{background:#e4f7f0;border:2px solid #0e9e7d;padding:14px;color:#08785c}.choice.selected.loss-choice{background:#fff0f1;border:2px solid #d95a72;padding:14px;color:#bd3b54}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{border:1px solid #dce2ed;background:#fff;border-radius:50px;padding:7px 12px;color:#5a6780;font-weight:700;font-size:.79rem}.tag.selected{background:var(--accent-soft);border-color:var(--accent);color:#5344cb}.spaced{display:flex;align-items:center;justify-content:space-between;gap:12px}.bar{height:9px;border-radius:20px;background:#edf0f7;overflow:hidden;margin:7px 0}.bar > div{height:100%;border-radius:inherit;background:var(--accent)}.bar > div.low{background:#e0707d}.bar > div.high{background:#13a584}.barrow{margin:0 0 15px}.barrow:last-child{margin-bottom:0}.barrow .spaced{font-size:.85rem}.barrow .spaced span:last-child{font-weight:800}.empty{text-align:center;padding:32px 16px;border:1px dashed var(--line);border-radius:13px;background:#fafbfe;color:var(--muted)}.empty strong{color:var(--ink);display:block;margin:0 0 7px}.result-row{display:flex;align-items:start;gap:12px;padding:14px 0;border-bottom:1px solid #e9edf4}.result-row:last-child{border-bottom:0}.result-row .content{flex:1;min-width:0}.result-row .result-title{font-weight:800;margin-bottom:3px}.result-row p{margin:3px 0;color:var(--muted);font-size:.79rem;overflow-wrap:anywhere}.result-row .mini-actions{display:flex;gap:5px}.callout{background:#f2f0ff;border:1px solid #e2deff;color:#5145b1;border-radius:13px;padding:12px 15px;font-size:.81rem}.notice{background:#fff9e9;border:1px solid #f3e7c5;color:#876627;border-radius:13px;padding:12px 15px;font-size:.8rem}.hidden{display:none!important}.tab-content{display:none}.tab-content.active{display:block}.count{font-variant-numeric:tabular-nums}.footnote{font-size:.73rem;color:var(--muted);margin-top:20px}.divider{border:0;border-top:1px solid var(--line);margin:20px 0}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1a2945;color:#fff;border-radius:12px;padding:13px 18px;z-index:12;box-shadow:0 5px 30px #0002;font-size:.85rem;max-width:90vw}.badge-line{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.mono{font-variant-numeric:tabular-nums} .selection-toggle{display:flex;gap:7px;align-items:center}.selection-toggle select{min-width:145px}
    @media(max-width:1050px){.app{grid-template-columns:195px minmax(0,1fr)}main{padding:28px 22px 45px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:720px){.app{display:block}aside{padding:13px 12px 8px;gap:9px;position:sticky;top:0;z-index:5}.brand{padding:0 3px}.brand strong{font-size:1.15rem}.brand .eyebrow,.brand small,.side-note{display:none}.nav{flex-direction:row;overflow:auto;gap:3px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{flex-direction:column;align-items:center;justify-content:center;padding:7px 8px;gap:2px;font-size:.67rem;min-width:58px;flex:1}.nav .symbol{font-size:1.2rem}main{padding:21px 13px 45px}.top{margin-bottom:16px}.top h1{font-size:1.4rem}.top-tag{display:none}.card{padding:16px;border-radius:14px}.stats{gap:10px}.stat-value{font-size:1.58rem}.slots{grid-template-columns:repeat(2,minmax(0,1fr))}.form-row{grid-template-columns:1fr}.pick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.result-row{flex-wrap:wrap}.result-row .mini-actions{width:100%;justify-content:end}}

    /* v0.2: name-search picker; no character images, logos or external resources */
    .slot-field{display:flex;align-items:stretch;gap:5px;min-width:0}.slot-field input{min-width:0;flex:1;width:1px}
    .slot-field .slot-open{background:#f1eeff;border:1px solid #d9d1fc;color:#5144b8;border-radius:10px;padding:0 9px;font-weight:800;white-space:nowrap;min-height:44px}
    .slot-field .slot-open:focus-visible,.picker-item:focus-visible,.picker-close:focus-visible{outline:3px solid #a99cff;outline-offset:2px}
    .type-markers{display:inline-flex;gap:3px;vertical-align:middle;margin-right:5px;flex-shrink:0}.type-marker{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid #00000010}
    .pick-name{display:flex;align-items:center;gap:3px;flex-wrap:wrap}.pick-name-text{font-size:.84rem}
    .picker-layer{position:fixed;inset:0;background:#131b38ac;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
    .picker-panel{background:#fff;width:min(100%,820px);height:min(86dvh,790px);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 22px 75px #0004}
    .picker-head{padding:18px 20px 12px;border-bottom:1px solid var(--line)}.picker-head-top{display:flex;align-items:start;justify-content:space-between;gap:15px}
    .picker-head h2{margin:0;font-size:1.24rem}.picker-head p{color:var(--muted);margin:4px 0 11px;font-size:.8rem}
    .picker-close{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 12px;min-height:42px;color:var(--ink);font-weight:800}
    .picker-head input{width:100%;border:1px solid #b5addf;border-radius:12px;padding:12px;font-size:1rem;min-height:48px}
    .picker-head input:focus{outline:3px solid #e8e3ff}
    .picker-current{padding:10px 18px 5px;display:flex;gap:7px;flex-wrap:wrap}
    .picker-slot{border:1px solid var(--line);background:#fafbff;color:var(--ink);border-radius:12px;padding:8px 10px;font-size:.8rem;min-height:39px;max-width:100%;overflow-wrap:anywhere}
    .picker-slot.active{background:#ece9ff;border-color:#7768e4;color:#4736a7;font-weight:800}
    .picker-note{padding:8px 20px 3px;color:var(--muted);font-size:.74rem}
    .picker-list{overflow:auto;padding:10px 18px 20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;align-content:start;flex:1;overscroll-behavior:contain}
    .picker-item{background:#f8f9fd;border:1px solid #e1e5f1;border-radius:12px;display:flex;align-items:center;gap:9px;text-align:left;min-height:55px;padding:10px;color:var(--ink);font-size:.84rem;font-weight:750;overflow-wrap:anywhere}
    .picker-item:hover{background:#eeebff;border-color:#8c7eea}.picker-item[disabled]{opacity:.32}
    .picker-monogram{width:34px;height:34px;border-radius:9px;background:#e6eafb;color:#41547b;display:flex;align-items:center;justify-content:center;font-weight:850;flex-shrink:0}
    .picker-item-text{display:flex;flex-direction:column;gap:3px;min-width:0}
    .picker-custom{grid-column:1/-1;background:#eef8f4;border-color:#aad9c9}.picker-empty{grid-column:1/-1;color:var(--muted);padding:18px;text-align:center}
    .version-badge{font-weight:800;color:#c3bafa;font-size:.74rem}
    @media(max-width:720px){.picker-panel{height:min(91dvh,790px);border-radius:16px}.picker-list{grid-template-columns:repeat(2,minmax(0,1fr));padding:8px 11px 14px}.picker-head{padding:13px}.picker-current{padding:8px 12px}.picker-note{padding:5px 13px}.slot-field .slot-open{padding:0 8px}}

/* v0.3: types, form-specific stats and battle transformations */
.type-chip{display:inline-block;color:white;font-size:.76rem;font-weight:800;padding:5px 10px;border-radius:7px}
.type-tags,.form-options{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 13px}
.dex-list{max-height:520px;overflow:auto;display:flex;flex-direction:column;gap:7px;padding-right:4px}
.dex-row{background:#f9faff;border:1px solid var(--line);border-radius:12px;min-height:55px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;color:var(--ink)}
.dex-row.current{border:2px solid var(--accent);background:#f2efff;padding:9px 11px}
.dex-row small{display:block;font-size:.71rem;color:var(--muted);margin-top:3px}
.dex-details h3{font-size:1.22rem;margin:0}
.base-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat-cell{border:1px solid #e8ebf2;border-radius:11px;padding:11px;background:#fafbff}.stat-cell span{display:block;color:var(--muted);font-size:.76rem}.stat-cell strong{font-size:1.25rem}.stat-tiny{height:5px;border-radius:5px;background:#e3e6f3;overflow:hidden;margin-top:6px}.stat-tiny div{height:100%;background:var(--accent)}
.saved-party-mons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:12px 0}.saved-party-mon{display:flex;flex-direction:column;gap:5px;border:1px solid var(--line);border-radius:10px;padding:9px}.saved-party-mon select{max-width:100%;padding:7px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:.78rem}.mon-link{text-align:left;background:transparent;border:0;color:var(--ink);font-size:.83rem;font-weight:800;padding:2px 0;overflow-wrap:anywhere}.mon-link:hover{text-decoration:underline}
.mega-block{border:1px solid #e4e8f0;border-radius:12px;padding:15px;background:#fcfdff}.form-mini .dex-details{border-top:1px solid #e4e8f0;margin-top:14px;padding-top:12px}.form-mini .base-stats{grid-template-columns:repeat(3,1fr)}.form-mini .stat-cell{padding:7px}.form-mini .stat-cell strong{font-size:1rem}
.gender-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.gender-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.variant-history{color:#4d439b!important;font-weight:700}
@media(max-width:880px){.saved-party-mons,.gender-columns,.gender-list{grid-template-columns:1fr}}
@media(max-width:520px){.base-stats{grid-template-columns:repeat(2,1fr)}}

/* v0.5: local-catalog team integration / defensive matchup, no external assets */
.team-members{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
.team-member{border:1px solid #e4e9f1;background:#fbfcff;border-radius:13px;padding:12px;min-width:0}
.team-types{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.team-types .type-chip{font-size:.71rem;padding:4px 8px}
.team-stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;margin:9px 0}
.team-stats span{display:flex;flex-direction:column;align-items:center;border-radius:7px;background:#eff2f9;padding:5px 0;min-width:0}
.team-stats small{font-size:.62rem;color:#67748c}.team-stats b{font-size:.85rem;font-variant-numeric:tabular-nums}
.team-control-label{font-size:.74rem!important;margin-top:8px}.team-control-label select{min-height:39px;padding:7px!important}
.team-analysis-box{border-top:1px solid #e4e8f1;border-bottom:1px solid #e4e8f1;margin:13px 0;padding:15px 0}
.team-risk{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.risk-chip{display:inline-flex;align-items:center;gap:5px;background:#fff6f2;border:1px solid #f5dbd2;border-radius:9px;padding:6px 8px;font-size:.75rem;color:#79463d}
.risk-chip i,.matrix-row i{width:9px;height:9px;border-radius:3px;display:inline-block;flex-shrink:0}
.matrix-details{margin:13px 0}.matrix-details summary{color:#5144b8;cursor:pointer;font-weight:800;font-size:.86rem;padding:8px}
.type-matrix{border:1px solid #e1e5ed;border-radius:11px;overflow:hidden;margin:8px 0}.matrix-head,.matrix-row{display:grid;grid-template-columns:1.6fr .6fr .9fr .6fr;padding:7px 9px;align-items:center;gap:3px;font-size:.76rem}
.matrix-head{background:#f0f3f9;color:#5e6a81;font-weight:800}.matrix-row:nth-child(odd){background:#f8f9fc}.matrix-row span{display:flex;align-items:center;gap:7px}.matrix-row b{text-align:center;font-variant-numeric:tabular-nums}
.danger-text{color:#c2465c}.warn-text{color:#b16539}.form-caption{color:#5645b7;font-size:.75rem;font-weight:700;margin:4px 0}
.draft-team-preview{background:#f7f7ff;border:1px solid #e4dfff;border-radius:12px;margin:13px 0;padding:12px}.draft-member-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.draft-member{background:white;border:1px solid #ecebf5;padding:9px;border-radius:9px;min-width:0;font-size:.79rem}.draft-member p{margin:4px 0}.draft-member b{overflow-wrap:anywhere}
.battle-dex-row{padding:9px 0;border-bottom:1px solid #eceef3}.team-analysis-section{margin-top:23px}.team-analysis-section>h2{font-size:1.18rem;margin-bottom:12px}
@media(max-width:1150px){.team-members{grid-template-columns:1fr}}
@media(max-width:720px){.team-members{grid-template-columns:1fr}}
@media(max-width:440px){.draft-member-grid{grid-template-columns:1fr}.type-matrix .matrix-row,.type-matrix .matrix-head{font-size:.69rem}}

/* v0.6: opponent appearance / observed / lead analytics */
.freq-section{border:1px solid #dedff9;background:linear-gradient(180deg,#fff 0%,#fcfcff 100%);margin:17px 0 20px}
.freq-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:9px}
.freq-eyebrow{font-size:.69rem;color:#6657d7;font-weight:850;letter-spacing:.09em;margin-bottom:6px}
.freq-top h2{margin:0;font-size:1.24rem}
.freq-control-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.freq-coverage{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:17px 0}
.freq-cover-card{border:1px solid #e5e8f1;border-radius:12px;background:#f7f8fd;padding:13px}
.freq-cover-card small{display:block;color:#67758c;font-size:.74rem;font-weight:750;margin-bottom:7px}
.freq-cover-card b{font-size:1.24rem;color:#202c47}
.freq-cover-card p{color:#758198;font-size:.7rem;margin:5px 0 0}
.freq-pills{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}
.freq-mode{border:1px solid #dfe2ed;border-radius:100px;padding:10px 13px;color:#606d85;background:#fff;font-size:.79rem;font-weight:800;min-height:44px}
.freq-mode.active{border-color:#7563ec;background:#efedff;color:#5545c8}
.freq-entry{border:1px solid #e5e8f2;background:#fff;border-radius:13px;padding:13px;margin:10px 0}
.freq-entry-name{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.freq-rank{font-size:.79rem;font-weight:850;color:#6756d8;background:#f1efff;border-radius:8px;min-width:31px;height:31px;display:inline-flex;align-items:center;justify-content:center}
.freq-entry-name strong{font-size:.92rem;overflow-wrap:anywhere}
.freq-entry-name .pill{font-size:.69rem}
.freq-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.freq-stat{padding:9px 10px;background:#f7f8fc;border-radius:9px;min-width:0}
.freq-stat.active{background:#f0edff;outline:1px solid #d3cbff}
.freq-stat span{font-size:.68rem;color:#62718c;display:block;margin-bottom:4px}
.freq-stat b{font-size:.94rem;color:#22304c;font-variant-numeric:tabular-nums}
.freq-stat small{font-size:.7rem;color:#66728b;display:block;margin-top:4px}
.freq-minibar{height:5px;background:#e5e9f1;border-radius:10px;overflow:hidden;margin-top:7px}
.freq-minibar i{display:block;height:100%;border-radius:inherit;background:#8779ee}
.freq-stat.active .freq-minibar i{background:#6555ea}
.freq-conditional{font-size:.75rem;color:#53607b;background:#f7f9fd;border-radius:8px;padding:8px 10px;margin-top:9px}
.freq-actions{display:flex;gap:9px;justify-content:center;margin:13px 0 0}
.lead-quick{border:1px solid #dad7ff;background:#f7f6ff;border-radius:12px;padding:13px;margin-top:14px}
.lead-quick h3{font-size:.87rem;margin:0 0 5px}
.lead-quick .quick-grid{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}

<script>
'use strict';
const STORAGE_KEY='champions-battle-notebook-v1'; // v0.1の保存領域をそのまま利用
const SPECIES=[]; // 個人データを読み込んだときだけ候補が増える
const TYPE_COLORS={'ノーマル':'#8b918a','ほのお':'#e97342','みず':'#4c8bd2','でんき':'#dfba36','くさ':'#61a65d','こおり':'#59b7c3','かくとう':'#c45a48','どく':'#9868ae','じめん':'#bb995f','ひこう':'#7f9ac7','エスパー':'#e26e91','むし':'#8da747','いわ':'#ab9363','ゴースト':'#7972a8','ドラゴン':'#726fc7','あく':'#686579','はがね':'#7b97a8','フェアリー':'#d48fbf'};
const TYPES=Object.create(null);

const FORM_DB=Object.create(null);
const FORM_GROUPS=Object.create(null);
const DEX_KEY='battle-note-private-catalog-v1'; // 公開HTMLに種別データは含めない
const VALID_TYPES=Object.keys(TYPE_COLORS);
const VALID_GENDERS=['unknown','male','female','none'];
let dexEntries=[];
function cleanEntry(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw))return null;
 const n=x=>typeof x==='string'?x.normalize('NFKC').trim().slice(0,70):'';
 const name=n(raw.name),species=n(raw.species||name);
 if(!name||!species||name.length>60||species.length>60||['__proto__','prototype','constructor'].includes(name))return null;
 const types=Array.isArray(raw.types)?[...new Set(raw.types.filter(t=>VALID_TYPES.includes(t)))].slice(0,2):[];
 const stats=Array.isArray(raw.stats)&&raw.stats.length===6&&raw.stats.every(v=>Number.isInteger(v)&&v>=0&&v<=255)?raw.stats.slice():null;
 return {name,species,types,stats,mega:raw.mega===true,gender:VALID_GENDERS.includes(raw.gender)?raw.gender:'unknown',ability:n(raw.ability).slice(0,80)};
}
function refreshRegistry(){
 for(const o of [FORM_DB,FORM_GROUPS,TYPES])for(const k of Object.keys(o))delete o[k];
 SPECIES.length=0;
 for(const entry of dexEntries){
  FORM_DB[entry.name]=entry;
  (FORM_GROUPS[entry.species] ||= []).push(entry.name);
  TYPES[entry.name]=entry.types;
  if(!entry.mega)SPECIES.push(entry.name);
 }
 const dl=document.querySelector('#pokemon-list');if(dl)dl.innerHTML=SPECIES.map(n=>`<option value="${h(n)}"></option>`).join('');
}
function loadPrivateDex(){try{const saved=JSON.parse(localStorage.getItem(DEX_KEY)||'null');if(saved&&saved.format==='personal-dex-v1'&&Array.isArray(saved.entries)){const map=new Map();for(const e of saved.entries.slice(0,3000)){const clean=cleanEntry(e);if(clean)map.set(clean.name,clean)}dexEntries=[...map.values()];}}catch(e){console.warn('個人図鑑が読み込めません',e)}refreshRegistry();}
function storePrivateDex(){try{localStorage.setItem(DEX_KEY,JSON.stringify({format:'personal-dex-v1',entries:dexEntries}));refreshRegistry();return true}catch(e){alert('個人図鑑を保存できませんでした。空き容量とSafariの設定を確認してください。');return false;}}
function allRecordedNames(){return [...new Set([...data.parties.flatMap(p=>p.pokemon||[]),...data.matches.flatMap(m=>[...(m.opponent||[]),m.myMega?.to,m.oppMega?.to]),...dexEntries.map(e=>e.name)].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));}
const speciesOf=n=>FORM_DB[n]?.species||n;
const megasFor=n=>(FORM_GROUPS[speciesOf(n)]||[]).filter(key=>FORM_DB[key].mega);
const displaySex=s=>s==='male'?'♂':s==='female'?'♀':s==='none'?'性別なし':'未確認';
const TYPE_TEXT=keys=>keys.map(t=>`<span class="type-chip" style="background:${TYPE_COLORS[t]||'#758095'}">${h(t)}</span>`).join('');
const baseStatNames=['HP','攻撃','防御','特攻','特防','素早さ'];
const formDetail=n=>{const v=FORM_DB[n];if(!v)return `<div class="notice">${h(n)}は詳細データ未収録です。名前での記録は続けられます。タイプや種族値は推測して表示しません。</div>`;const total=v.stats?.reduce((a,b)=>a+b,0);return `<div class="dex-details"><div class="spaced"><h3>${h(n)}</h3><span class="pill">種族値合計 ${total===undefined?'未登録':total}</span></div><p class="help">${v.mega?'形態変化後':'見せ合い時の姿'}｜元の種類：${h(v.species)} ${v.gender?'｜性別：'+displaySex(v.gender):''}</p><div class="type-tags">${TYPE_TEXT(v.types||[])}</div>${v.ability?`<p class="small muted">特性例：${h(v.ability)}（実際の特性は確認した内容を優先）</p>`:''}<div class="base-stats">${(v.stats||[]).map((x,i)=>`<div class="stat-cell"><span>${baseStatNames[i]}</span><strong>${x}</strong><div class="stat-tiny"><div style="width:${Math.min(100,x/180*100)}%"></div></div></div>`).join('')}</div><p class="help">${v.stats?'':'種族値は未登録です。'} ここに表示するのは種族値で、努力値・個体値・性格などを反映した実数値ではありません。</p></div>`;};

const STYLES=['未分類','対面','サイクル','積み展開','受け','天候','トリックルーム','その他'];
const WIN_TAGS=['選出が刺さった','初手有利','立ち回り','相手のエースを対策','積み展開が成功','サイクル有利','素早さ有利','運要素'];
const LOSS_TAGS=['選出ミス','初手不利','立ち回りミス','特定のモンスター','素早さ負け','積み展開への対処','受け崩し不足','状態異常','運要素'];
const labels={home:['対戦専用ホーム','対戦前の予測から記録までをまとめて操作。'],record:['対戦を記録','1試合の結果を短時間で残そう。'],review:['予測の答え合わせ','対戦前の予測と実際の結果を比較。'],threat:['要対策ポケモン','よく遭遇し、負けが多い相手を確認。'],analysis:['対戦分析','相手のモンスターや選出との相性を見つけよう。'],predict:['選出・先発予測','相手の見せ合い6匹から、記録に基づいて傾向を予測。'],parties:['パーティ管理','構築を登録して、バージョン別に勝率を比較。'],dex:['個人図鑑・種族値','自分で登録したフォーム・タイプ・種族値を管理。'],history:['対戦履歴','いつでも過去の試合を見返せる。'],backup:['保存・バックアップ','対戦データをファイルに書き出して保管。']};
const $=sel=>document.querySelector(sel);
const h=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const freshDraft=()=>({result:'win',partyId:'',opponent:Array(6).fill(''),myPicks:[],opponentPicks:[],myLead:'',oppLead:'',trouble:'',style:'未分類',tags:[],memo:'',myMega:{from:'',to:''},oppMega:{from:'',to:''},oppGenders:{},myGenders:{},predictionSnapshot:null,editId:null});
const initial=()=>({version:1,parties:[],matches:[]});
let data=initial(),draft=freshDraft(),tab='home',analysisParty='all',analysisMode='preview',historyParty='all',historyResult='all',historyQuery='',toastTimer=null;
try {const value=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(value&&Array.isArray(value.parties)&&Array.isArray(value.matches)){data=value;}}catch(e){console.warn('データの読み込みに失敗',e)}
loadPrivateDex();

// v0.2: iPad向けの画像なし検索・タップ選択画面
const typeMarks=name=>{const kinds=TYPES[name]||[];return `<span class="type-markers" aria-label="${h(kinds.join('・')||'タイプ情報なし')}">${(kinds.length?kinds:['未設定']).map(t=>`<span class="type-marker" title="${h(t)}" style="background:${TYPE_COLORS[t]||'#b8c1d2'}"></span>`).join('')}</span>`};
let pickerState=null;
const normalizeMon=v=>String(v??'').normalize('NFKC').trim();
function pickerValues(){if(!pickerState)return [];if(pickerState.kind==='party'){const f=$('#party-form');return f?Array.from({length:6},(_,i)=>f.elements[`party-mon-${i}`]?.value.trim()||''):[];}return [...draft.opponent];}
function pokemonCandidates(){const used=[...data.parties.flatMap(p=>p.pokemon||[]),...data.matches.flatMap(m=>m.opponent||[]),...draft.opponent];const f=$('#party-form');if(f)used.push(...Array.from({length:6},(_,i)=>f.elements[`party-mon-${i}`]?.value||''));return [...new Set([...used,...SPECIES].map(normalizeMon).filter(Boolean))];}
function openPicker(kind,slot){pickerState={kind,slot,query:'',limit:90};$('#picker-layer').classList.remove('hidden');$('#picker-layer').setAttribute('aria-hidden','false');$('#picker-title').textContent=(kind==='party'?'自分のパーティ':'相手のパーティ')+'：モンスター選択';$('#picker-query').value='';renderPicker();requestAnimationFrame(()=>$('#picker-query').focus());}
function closePicker(){pickerState=null;$('#picker-layer').classList.add('hidden');$('#picker-layer').setAttribute('aria-hidden','true');}
function renderPicker(){
 if(!pickerState)return;
 const values=pickerValues(),q=normalizeMon(pickerState.query).toLocaleLowerCase('ja-JP');
 const existing=new Set(values.map(normalizeMon).filter(Boolean));
 const all=pokemonCandidates().filter(n=>n.toLocaleLowerCase('ja-JP').includes(q))
   .sort((a,b)=>Number(existing.has(b))-Number(existing.has(a))||a.localeCompare(b,'ja'));
 const found=all.slice(0,pickerState.limit||90);

function persistMatch(){const party=data.parties.find(p=>p.id===draft.partyId);if(!party){alert('パーティを選んでください');return;}const opponent=draft.opponent.map(s=>s.trim());if(new Set(opponent.filter(Boolean)).size!==opponent.filter(Boolean).length){alert('相手のパーティに同じ名前が複数あります。確認してください。');return;}const payload={id:draft.editId||uid(),date:draft.editId?(data.matches.find(m=>m.id===draft.editId)?.date||new Date().toISOString()):new Date().toISOString(),partyId:draft.partyId,result:draft.result,opponent,myPicks:[...draft.myPicks],opponentPicks:[...draft.opponentPicks],myLead:draft.myLead,oppLead:draft.oppLead,trouble:draft.trouble,style:draft.style,tags:[...draft.tags],memo:draft.memo.trim(),myMega:{...draft.myMega},oppMega:{...draft.oppMega},oppGenders:{...draft.oppGenders,...Object.fromEntries(draft.opponentPicks.filter(n=>FORM_DB[n]?.gender&&FORM_DB[n].gender!=='unknown').map(n=>[n,FORM_DB[n].gender]))},myGenders:{...draft.myGenders,...Object.fromEntries(draft.myPicks.filter(n=>FORM_DB[n]?.gender&&FORM_DB[n].gender!=='unknown').map(n=>[n,FORM_DB[n].gender]))},predictionSnapshot:draft.predictionSnapshot||null};const editIndex=draft.editId?data.matches.findIndex(m=>m.id===draft.editId):-1;const original=editIndex>=0?data.matches[editIndex]:null;if(editIndex>=0)data.matches[editIndex]=payload;else data.matches.push(payload);if(!saveData()){if(editIndex>=0)data.matches[editIndex]=original;else data.matches.pop();return;}draft=freshDraft();draft.partyId=party.id;toast('対戦記録を保存したよ！');setTab('home')}

function calcDamageMultiplier(attack,defending){

function freqName(value){return typeof value==='string'?normalizeMon(value):'';}
function freqKey(value){const n=freqName(value);return n?(frequencyGrouping==='species'?speciesOf(n):n):'';}
function freqKeys(values){return new Set((Array.isArray(values)?values:[]).map(freqKey).filter(Boolean));}
function freqSnapshot(){
 const games=data.matches.filter(m=>(analysisParty==='all'||m.partyId===analysisParty)
  &&(frequencyOwnLead==='all'||freqName(m.myLead)===frequencyOwnLead));
 const records=games.map(m=>({preview:freqKeys(m.opponent),seen:freqKeys(m.opponentPicks),lead:freqKey(m.oppLead)}));
 const eligible={preview:0,seen:0,lead:0};const totals=new Map();
 function ensure(key){if(!totals.has(key))totals.set(key,{name:key,preview:0,seen:0,lead:0,opportunities:0,startedWhenShown:0});return totals.get(key);}
 for(const r of records){
  if(r.preview.size)eligible.preview++;
  if(r.seen.size)eligible.seen++;
  if(r.lead)eligible.lead++;
  for(const key of r.preview)ensure(key).preview++;
  for(const key of r.seen)ensure(key).seen++;
  if(r.lead)ensure(r.lead).lead++;
  if(r.lead){for(const key of r.preview){const item=ensure(key);item.opportunities++;if(key===r.lead)item.startedWhenShown++;}}
 }
 const rows=[...totals.values()].sort((a,b)=>b[frequencySort]-a[frequencySort]||b.preview-a.preview||a.name.localeCompare(b.name,'ja'));

}

  const conditional=r.opportunities?`${r.startedWhenShown}回 / ${r.opportunities}試合 = ${freqRate(r.startedWhenShown,r.opportunities)}`:'—（該当する先発記録なし）';

 }).join('');
 const resultRows=snap.rows.length?rows:'<div class="empty"><strong>まだ対象のポケモン記録がありません</strong><div class="small">対戦記録で相手の6匹・確認できた選出・先発を登録すると、ここに表示されます。</div></div>';
 const more=snap.rows.length>12?`<div class="freq-actions"><button type="button" class="button secondary" data-freq-more>${frequencyShowAll?'上位12件だけ表示':`残り${snap.rows.length-12}件も表示`}</button></div>`:'';
 return `<div class="card freq-section" id="freq-section"><div class="freq-top"><div><div class="freq-eyebrow">OPPONENT FREQUENCY / Ver.1.0</div><h2>相手の出現・選出・先発ランキング</h2><p class="section-intro" style="margin:7px 0 0">勝ち負けに関係なく、記録済みの相手の傾向を集計。上の「分析するパーティ」で切り替えできます。</p></div><span class="pill">${snap.games.length}試合を対象</span></div>
 <div class="freq-control-row"><label class="field">自分の先発で絞り込む<select class="generic" id="freq-own-lead"><option value="all">指定しない（先発未記録も含む）</option>${ownLeads.map(n=>`<option value="${h(n)}" ${frequencyOwnLead===n?'selected':''}>${h(n)}を先発にした試合</option>`).join('')}</select></label><label class="field">種類・姿のまとめ方<select class="generic" id="freq-group"><option value="form" ${frequencyGrouping==='form'?'selected':''}>姿ごとに分ける</option><option value="species" ${frequencyGrouping==='species'?'selected':''}>同じ種類でまとめる</option></select></label></div>

 <div class="freq-list" aria-live="polite">${resultRows}</div>${more}<div class="notice" style="margin-top:15px">ランキングは記録に基づく出現傾向です。先発率と「見せ合いにいたときの先発割合」は分母が異なります。メガシンカ後の姿が確認された場合でも、見せ合い・先発は記録された名前を使います。</div></div>`;

// ---------- Ver.0.7: local-first IndexedDB storage, legacy migration and backup ----------
const V07_DB_NAME='battle-note-v07-idb';
const V07_DB_VERSION=1;
let v07db=null,v07Ready=false,v07Mode='loading',v07Error='',v07Pending=0;
let v07Queue=Promise.resolve();
let v07SavedSignatures={parties:new Map(),matches:new Map(),dex:new Map()};
const v07LegacySave=saveData;
const v07LegacyDexSave=storePrivateDex;
const v07ObjectKey={parties:'id',matches:'id',dex:'name'};
function v07Status(msg,mode='ok'){
 const line=document.getElementById('v07-progress');const body=document.getElementById('v07-progress-text');
 if(!line||!body)return;
 line.hidden=false;line.style.display='flex';body.textContent=msg;
 line.style.borderColor=mode==='error'?'#e8a0aa':mode==='warn'?'#e9ca91':'#cfe5dc';
 line.style.background=mode==='error'?'#fff1f2':mode==='warn'?'#fff8e8':'#effaf5';
}
function v07QueuedStatus(){
 if(v07Error){v07Status('⚠ 保存に失敗しました。画面を閉じず、すぐに「保存設定」からバックアップを作ってください。','error');return;}
 if(v07Mode==='idb')v07Status(v07Pending?'保存中…（完了するまでは画面を閉じないでください）':'✓ IndexedDBに保存済み（iPad内）');
 else if(v07Mode==='legacy')v07Status('⚠ IndexedDBを利用できません。旧方式で動作中。バックアップを取ってください。','warn');
}
function v07Open(){return new Promise((resolve,reject)=>{
 if(!('indexedDB' in window)){reject(new Error('IndexedDBに対応していません'));return;}
 const r=indexedDB.open(V07_DB_NAME,V07_DB_VERSION);
 r.onupgradeneeded=()=>{const d=r.result;
  for(const [name,key] of [['parties','id'],['matches','id'],['dex','name'],['meta','key']])if(!d.objectStoreNames.contains(name)){const o=d.createObjectStore(name,{keyPath:key});if(name==='matches'){o.createIndex('partyId','partyId',{unique:false});o.createIndex('date','date',{unique:false});o.createIndex('result','result',{unique:false});}if(name==='dex')o.createIndex('species','species',{unique:false});}
 };
 r.onsuccess=()=>{const d=r.result;d.onversionchange=()=>{d.close();v07Status('別のタブで保存形式が変更されました。再読み込みしてください。','warn')};resolve(d)};
 r.onerror=()=>reject(r.error||new Error('DBのオープンに失敗'));
 r.onblocked=()=>reject(new Error('別のタブで使用中です。タブを閉じて再読み込みしてください。'));
});}
function v07Req(req){return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('保存データの読み込みに失敗'));});}
function v07GetAll(store){return v07Req(v07db.transaction(store,'readonly').objectStore(store).getAll());}
function v07Transaction(storeNames,callback){return new Promise((resolve,reject)=>{
 let tx;
 try{tx=v07db.transaction(storeNames,'readwrite');callback(tx);}
 catch(e){try{tx?.abort()}catch(_){}reject(e);return;}
 tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('保存に失敗しました'));tx.onabort=()=>reject(tx.error||new Error('保存が中断されました'));
});}
function v07RecordSignatures(store,rows){return new Map(rows.map(x=>[String(x[v07ObjectKey[store]]),JSON.stringify(x)]));}
function v07ResetSignatures(){v07SavedSignatures={parties:v07RecordSignatures('parties',data.parties),matches:v07RecordSignatures('matches',data.matches),dex:v07RecordSignatures('dex',dexEntries)};}
function v07Diff(store,rows){const before=v07SavedSignatures[store],after=new Map(),upserts=[];const key=v07ObjectKey[store];
 for(const item of rows){const id=String(item[key]);const str=JSON.stringify(item);after.set(id,str);if(before.get(id)!==str)upserts.push(JSON.parse(str));}
 const removes=[...before.keys()].filter(k=>!after.has(k));return {store,upserts,removes,after};
}
function v07QueueChange(changes){
 if(v07Error){alert('保存処理に問題があります。先にバックアップを書き出してください。');return false;}
 const changed=changes.filter(c=>c.upserts.length||c.removes.length);
 if(!changed.length)return true;
 for(const c of changes)v07SavedSignatures[c.store]=c.after;
 v07Pending++;v07QueuedStatus();
 // All writes are serialized; transactions change only added/edited/deleted records.
 v07Queue=v07Queue.then(()=>v07Transaction(changed.map(c=>c.store),tx=>{
  for(const c of changed){const store=tx.objectStore(c.store);for(const id of c.removes)store.delete(id);for(const x of c.upserts)store.put(x);}
 })).then(()=>{v07Pending--;v07QueuedStatus();}).catch(err=>{v07Pending--;v07Error=String(err?.message||err);console.error('IndexedDB保存エラー',err);v07QueuedStatus();});
 return true;
}
function v07SaveData(){if(v07Mode!=='idb')return v07LegacySave();return v07QueueChange([v07Diff('parties',data.parties),v07Diff('matches',data.matches)]);}
function v07SaveDex(){if(v07Mode!=='idb')return v07LegacyDexSave();const ok=v07QueueChange([v07Diff('dex',dexEntries)]);if(ok)refreshRegistry();return ok;}
async function v07ReplaceEntire(nextData,nextDex){
 if(v07Mode==='idb'){
  await v07Queue;
  if(v07Error)throw new Error('以前の保存が失敗しているため、復元を中止しました。');
  await v07Transaction(['parties','matches','dex','meta'],tx=>{
   for(const name of ['parties','matches','dex'])tx.objectStore(name).clear();
   for(const p of nextData.parties)tx.objectStore('parties').put(p);
   for(const m of nextData.matches)tx.objectStore('matches').put(m);
   for(const e of nextDex)tx.objectStore('dex').put(e);
   tx.objectStore('meta').put({key:'initialized',value:true,at:new Date().toISOString()});
  });
 }else{
  // On older browsers preserve the original fallback. Fail before changing the UI on quota errors.
  localStorage.setItem(STORAGE_KEY,JSON.stringify(nextData));
  localStorage.setItem(DEX_KEY,JSON.stringify({format:'personal-dex-v1',entries:nextDex}));
 }
 data=nextData;dexEntries=nextDex;refreshRegistry();v07ResetSignatures();draft=freshDraft();v07QueuedStatus();setTab('home');
}
function v07ValidateBackup(obj){
 if(!obj||obj.version!==1||!Array.isArray(obj.parties)||!Array.isArray(obj.matches))throw new Error('対戦ノート用のバックアップではありません。');
 if(obj.parties.length>20000||obj.matches.length>150000)throw new Error('記録数が多すぎるため、安全のため取り込みを中止しました。');
 const ids=new Set(),mids=new Set();
 for(const p of obj.parties){if(!p||typeof p.id!=='string'||!p.id||!Array.isArray(p.pokemon)||p.pokemon.length>6||p.pokemon.some(x=>typeof x!=='string')||ids.has(p.id))throw new Error('パーティデータが不正または重複しています。');ids.add(p.id);}
 for(const m of obj.matches){if(!m||typeof m.id!=='string'||!m.id||typeof m.partyId!=='string'||!['win','loss'].includes(m.result)||mids.has(m.id))throw new Error('対戦記録が不正または重複しています。');mids.add(m.id);}
 const newDex=obj.personalDex?importEntries(obj.personalDex):dexEntries.slice();

}
async function v07InitDB(){
 v07db=await v07Open();
 const marker=await v07Req(v07db.transaction('meta','readonly').objectStore('meta').get('initialized'));
 if(!marker?.value){
  v07Status(`旧データを移行中…（${data.matches.length}試合・${data.parties.length}構築・図鑑${dexEntries.length}件）`);
  await v07Transaction(['parties','matches','dex','meta'],tx=>{
   for(const p of data.parties)tx.objectStore('parties').put(p);
   for(const m of data.matches)tx.objectStore('matches').put(m);
   for(const e of dexEntries)tx.objectStore('dex').put(e);
   tx.objectStore('meta').put({key:'initialized',value:true,at:new Date().toISOString()});
  });
  const counts=await Promise.all(['parties','matches','dex'].map(n=>v07Req(v07db.transaction(n).objectStore(n).count())));
  if(counts[0]!==data.parties.length||counts[1]!==data.matches.length||counts[2]!==dexEntries.length)throw new Error('移行した件数が一致しません。旧データは消していません。');
 }else{
  // Once migrated, IndexedDB is authoritative; old localStorage values are retained, but never reused over newer data.
  const [parties,matches,entries]=await Promise.all([v07GetAll('parties'),v07GetAll('matches'),v07GetAll('dex')]);
  data={version:1,parties,matches};dexEntries=entries.map(cleanEntry).filter(Boolean);refreshRegistry();
 }
 v07Mode='idb';saveData=v07SaveData;storePrivateDex=v07SaveDex;v07ResetSignatures();
}

const predDistinct = arr => [...new Set((Array.isArray(arr) ? arr : []).map(predKey).filter(Boolean))];

}
function predLead(m,preview){const lead=predKey(m.oppLead);return lead&&preview.has(lead)?lead:'';}

const predRankRate=(n,d,prior,denPrior)=> d<3?null:(n+prior)/(d+denPrior);

 let ms=data.matches.filter(m=>m.partyId===id).sort(predDateSort);

   if(lead){r.leadDen++;if(lead===name)r.leadYes++;}
   if(picks){r.selectedDen++;if(picks.has(name))r.selectedYes++;}
   if(lead&&picks&&picks.has(name)){

   }

  if(picks&&[...picks].every(n=>candSet.has(n))){

function predRank(rows,field){

 const ranked=[...rows].sort((a,b)=>(b[info.v]??-1)-(a[info.v]??-1)||b[info.den]-a[info.den]||a.name.localeCompare(b.name,'ja'));
 return ranked.map((r,i)=>{
  const d=r[info.den],n=r[info.yes],predict=r[info.v];

 <div class="grid stats">${metric('構築の対戦数',ms.length,'選択中の構築のみ')}${metric('敗北数',ms.filter(m=>m.result==='loss').length,'集計対象の全敗北')}${metric('相手の種類',rows.length,'上位25件まで表示')}${metric('優先候補',rows.length?rows[0].losses+'敗':'—',rows.length?h(rows[0].name):'記録なし')}</div>
 <div class="card"><h2>敗北が多かった相手 TOP25</h2>${rows.length?rows.map((r,i)=>`<div class="v10-ranking-row"><div style="flex:1"><div class="spaced"><strong>${i+1}. ${h(r.name)}</strong>${r.encounters<3?'<span class="v10-flag">データ少</span>':''}</div><div class="v10-secondary">出現 ${r.encounters}試合／相手入り勝率 ${percent(r.wins,r.encounters)}%／遭遇率 ${ms.length?(100*r.exposure).toFixed(1):'—'}%</div><div class="bar"><div class="low" style="width:${ms.length?(100*r.priority).toFixed(1):0}%"></div></div></div><div style="text-align:right"><strong style="font-size:1.2rem">${r.losses}敗</strong><div class="v10-secondary">${r.wins}勝</div></div></div>`).join(''):'<div class="empty">まだ相手の情報がありません。対戦記録を増やしてみてね。</div>'}
 <div class="notice" style="margin-top:16px">順位は「その相手を含む試合の敗北数」の多い順。同じ敗北試合が複数のポケモンに数えられるよ。<strong>そのポケモンが直接の敗因だったとは限らない</strong>ので、メモや対戦履歴と併せて確認しよう。実際の選出は確認できた相手だけを数えるよ。</div></div>`;
}
const v10PreviousRender=render;
render=function(){if(tab==='review')renderReview();else if(tab==='threat')renderThreat();else v10PreviousRender();};
// Decorate the team list without changing historical IDs.
const v10PartiesBefore=renderParties;
renderParties=function(){v10PartiesBefore();
 document.querySelectorAll('#tab-parties .team-party-card').forEach((card,i)=>{
  const p=data.parties[i];if(!p)return;
  if(p.id===v10MainPartyId())card.classList.add('v10-active');
  card.querySelector('.actions')?.insertAdjacentHTML('afterbegin',`<button type="button" class="button ${p.id===v10MainPartyId()?'ghost':'secondary'} small" data-v10-main="${h(p.id)}" ${p.id===v10MainPartyId()?'disabled':''}>${p.id===v10MainPartyId()?'★ 使用中':'★ メインにする'}</button>`);
 });
};
const v10PreviousPredPickerClose=predPickerClose;
predPickerClose=function(){v10PreviousPredPickerClose();if(tab==='home')renderHome();};
// Click handlers in capture phase so pre-existing generic handlers cannot consume these buttons.
document.addEventListener('click',e=>{
 const btn=e.target.closest('button');if(!btn)return;
 if(btn.dataset.v10Main!==undefined){e.preventDefault();e.stopImmediatePropagation();v10SwitchMain(btn.dataset.v10Main);return;}
 if(btn.dataset.v10Pick!==undefined){e.preventDefault();e.stopImmediatePropagation();predPickerOpen(Number(btn.dataset.v10Pick));return;}
 if(btn.hasAttribute('data-v10-clear')){e.preventDefault();e.stopImmediatePropagation();predOpponent=Array(6).fill('');renderHome();return;}
 if(btn.hasAttribute('data-v10-calc')){e.preventDefault();e.stopImmediatePropagation();predOpponent=Array.from({length:6},(_,i)=>normalizeMon($('#v10-mon-'+i)?.value||''));renderHome();return;}
 if(btn.hasAttribute('data-v10-record')){e.preventDefault();e.stopImmediatePropagation();predOpponent=Array.from({length:6},(_,i)=>normalizeMon($('#v10-mon-'+i)?.value||''));predParty=v10MainPartyId();v10TransferToRecord();return;}
},true);
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.v10Mon!==undefined)predOpponent[Number(el.dataset.v10Mon)]=el.value;},true);
document.addEventListener('change',e=>{const el=e.target;
 if(el.id==='v10-main-select'){v10SwitchMain(el.value);return;}
 if(el.id==='v10-review-party'){v10ReviewParty=el.value;renderReview();return;}
 if(el.id==='v10-threat-party'){v10ThreatParty=el.value;renderThreat();return;}
 if(el.id==='v10-threat-mode'){v10ThreatMode=el.value;renderThreat();return;}
},true);
async function v10AfterInit(){
 // Imported Ver.0.7–0.9 backups contain parties + matches. No schema change is required.
 const main=v10MainPartyId();if(main){predParty=main;v10ReviewParty=main;v10ThreatParty=main;
  if(!draft.editId)draft.partyId=main;analysisParty=main;}
 $('#page-title').textContent=labels[tab][0];$('#page-sub').textContent=labels[tab][1];
 render();
}

initV07().then(v10AfterInit).catch(err=>console.error("1.0初期表示",err));
</script>
</body>
