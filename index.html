function persistMatch(){const party=data.parties.find(p=>p.id===draft.partyId);if(!party){alert('パーティを選んでください');return;}const opponent=draft.opponent.map(s=>s.trim());if(new Set(opponent.filter(Boolean)).size!==opponent.filter(Boolean).length){alert('相手のパーティに同じ名前が複数あります。確認してください。');return;}const payload={id:draft.editId||uid(),date:draft.editId?(data.matches.find(m=>m.id===draft.editId)?.date||new Date().toISOString()):new Date().toISOString(),partyId:draft.partyId,result:draft.result,opponent,myPicks:[...draft.myPicks],opponentPicks:[...draft.opponentPicks],myLead:draft.myLead,oppLead:draft.oppLead,trouble:draft.trouble,style:draft.style,tags:[...draft.tags],memo:draft.memo.trim(),myMega:{...draft.myMega},oppMega:{...draft.oppMega},oppGenders:{...draft.oppGenders,...Object.fromEntries(draft.opponentPicks.filter(n=>FORM_DB[n]?.gender).map(n=>[n,FORM_DB[n].gender]))},myGenders:{...draft.myGenders,...Object.fromEntries(draft.myPicks.filter(n=>FORM_DB[n]?.gender).map(n=>[n,FORM_DB[n].gender]))}};let previous=JSON.stringify(data.matches);if(draft.editId){const idx=data.matches.findIndex(m=>m.id===draft.editId);if(idx>=0)data.matches[idx]=payload;else data.matches.push(payload)}else data.matches.push(payload);if(!saveData()){data.matches=JSON.parse(previous);return;}draft=freshDraft();draft.partyId=party.id;toast('対戦記録を保存したよ！');setTab('home')}
function startEdit(id){const m=data.matches.find(m=>m.id===id);if(!m)return;draft={result:m.result,partyId:m.partyId,opponent:Array.from({length:6},(_,i)=>m.opponent?.[i]||''),myPicks:[...(m.myPicks||[])],opponentPicks:[...(m.opponentPicks||[])],myLead:m.myLead||'',oppLead:m.oppLead||'',trouble:m.trouble||'',style:m.style||'未分類',tags:[...(m.tags||[])],memo:m.memo||'',myMega:m.myMega||{from:'',to:''},oppMega:m.oppMega||{from:'',to:''},oppGenders:m.oppGenders||{},myGenders:m.myGenders||{},editId:m.id};setTab('record')}
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.hasAttribute('data-picker-close')){closePicker();return;}if(btn.dataset.pickerSlot!==undefined){if(pickerState){pickerState.slot=Number(btn.dataset.pickerSlot);renderPicker();}return;}if(btn.dataset.pickPokemon!==undefined){applyPokemonChoice(btn.dataset.pickPokemon);return;}if(btn.dataset.openPicker!==undefined){openPicker(btn.dataset.openPicker,Number(btn.dataset.pickerIndex));return;}if(btn.dataset.tab){setTab(btn.dataset.tab);return;}if(btn.dataset.partyUse){draft=freshDraft();draft.partyId=btn.dataset.partyUse;setTab('record');return;}if(btn.dataset.partyDelete){const id=btn.dataset.partyDelete;if(data.matches.some(m=>m.partyId===id))return;if(!confirm('このパーティを削除しますか？'))return;const old=data.parties;data.parties=old.filter(p=>p.id!==id);if(!saveData())data.parties=old;else{toast('パーティを削除しました');render()}return;}if(btn.hasAttribute('data-update-opponent')){renderRecord();toast('選出候補を更新しました');return;}if(btn.dataset.result){if(draft.result!==btn.dataset.result){draft.result=btn.dataset.result;draft.tags=[];}renderRecord();return;}if(btn.dataset.toggleMy){const mon=btn.dataset.toggleMy;draft.myPicks=draft.myPicks.includes(mon)?draft.myPicks.filter(m=>m!==mon):draft.myPicks.length<3?[...draft.myPicks,mon]:draft.myPicks;renderRecord();return;}if(btn.dataset.toggleOpp){const mon=btn.dataset.toggleOpp;draft.opponentPicks=draft.opponentPicks.includes(mon)?draft.opponentPicks.filter(m=>m!==mon):draft.opponentPicks.length<3?[...draft.opponentPicks,mon]:draft.opponentPicks;renderRecord();return;}if(btn.dataset.tag){const val=btn.dataset.tag;draft.tags=draft.tags.includes(val)?draft.tags.filter(t=>t!==val):[...draft.tags,val];renderRecord();return;}if(btn.hasAttribute('data-record-save')){persistMatch();return;}if(btn.hasAttribute('data-record-cancel')){draft=freshDraft();toast('編集を中止しました');setTab('history');return;}if(btn.dataset.editMatch){startEdit(btn.dataset.editMatch);return;}if(btn.dataset.deleteMatch){if(!confirm('この対戦記録を削除しますか？'))return;const old=data.matches;data.matches=old.filter(m=>m.id!==btn.dataset.deleteMatch);if(!saveData())data.matches=old;else{toast('対戦記録を削除しました');render()}return;}if(btn.id==='export'){const json=JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2);const blob=new Blob([json],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='champions-battle-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('バックアップを書き出しました');return;}if(btn.id==='import'){$('#import-file').click();return;}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='record-party'){draft.partyId=t.value;draft.myPicks=[];draft.myLead='';renderRecord()}else if(t.matches('.opp-slot')){draft.opponent[Number(t.dataset.oppSlot)]=t.value.trim()}else if(t.id==='my-lead')draft.myLead=t.value;else if(t.id==='opp-lead')draft.oppLead=t.value;else if(t.id==='trouble')draft.trouble=t.value;else if(t.id==='opp-style')draft.style=t.value;else if(t.id==='analysis-party'){analysisParty=t.value;renderAnalysis()}else if(t.id==='analysis-mode'){analysisMode=t.value;renderAnalysis()}else if(t.id==='history-party'){historyParty=t.value;renderHistory()}else if(t.id==='history-result'){historyResult=t.value;renderHistory()}else if(t.id==='import-file'){const file=t.files?.[0];if(!file)return;file.text().then(text=>{let obj;try{obj=JSON.parse(text)}catch(_){alert('JSONファイルが読み取れませんでした');return;}if(!obj||!Array.isArray(obj.parties)||!Array.isArray(obj.matches)||obj.version!==1||obj.parties.some(p=>typeof p.id!=='string'||!Array.isArray(p.pokemon))||obj.matches.some(m=>typeof m.id!=='string'||typeof m.partyId!=='string')){alert('このアプリのバックアップファイルではないようです');return;}if(!confirm('現在のデータを、このファイルのデータで置き換えますか？\nこの操作は取り消せません。'))return;const previous=data;data={version:1,parties:obj.parties,matches:obj.matches};if(!saveData()){data=previous;return;}draft=freshDraft();toast('バックアップを復元しました');setTab('home')}).catch(()=>alert('ファイルを読み取れませんでした')).finally(()=>{t.value=''});}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='picker-query'){if(pickerState){pickerState.query=t.value;renderPicker();}return;}if(t.matches('.opp-slot'))draft.opponent[Number(t.dataset.oppSlot)]=t.value;else if(t.id==='memo')draft.memo=t.value;else if(t.id==='history-query'){historyQuery=t.value;const list=$('#history-list');if(list){let matches=[...data.matches].sort((a,b)=>new Date(b.date)-new Date(a.date)).filter(m=>(historyParty==='all'||m.partyId===historyParty)&&(historyResult==='all'||m.result===historyResult));if(historyQuery.trim()){const q=historyQuery.trim().toLowerCase();matches=matches.filter(m=>[...opponents(m),...(m.myPicks||[]),...(m.opponentPicks||[]),m.memo||'',...(m.tags||[]),nameOfParty(m.partyId)].join(' ').toLowerCase().includes(q));}list.innerHTML=matches.length?matches.map(m=>detailCard(m,true)).join(''):empty('条件に一致する記録はありません','検索語を変えてみてね。')}}});
document.addEventListener('submit',e=>{if(e.target.id!=='party-form')return;e.preventDefault();const f=e.target;const name=f.elements['party-name'].value.trim();const mons=Array.from({length:6},(_,i)=>f.elements[`party-mon-${i}`].value.trim());if(!name||mons.some(m=>!m)){alert('パーティ名と6匹をすべて入力してください');return;}if(mons.some(mon=>FORM_DB[mon]?.mega)){alert('パーティの6匹はメガシンカ前の名前で登録してね。');return;}if(new Set(mons.map(speciesOf)).size!==6){alert('同じ種類のポケモンを複数登録できません。姿違いも同じ種類として扱います。');return;}const item={id:uid(),name,pokemon:mons,genders:Array.from({length:6},(_,i)=>f.elements[`party-gender-${i}`].value),createdAt:new Date().toISOString()};data.parties.push(item);if(!saveData()){data.parties.pop();return;}draft.partyId=item.id;toast('パーティを登録しました');renderParties()});
$('#picker-layer').addEventListener('click',e=>{if(e.target.id==='picker-layer')closePicker()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pickerState)closePicker()});

// ---- v0.3 form-aware UX, no external network calls ----
const genderOptions=(val='unknown',name='')=>{const fixed=FORM_DB[name]?.gender;if(fixed)return `<option value=\"${fixed}\" selected>${displaySex(fixed)}</option>`;return [['unknown','性別未確認'],['male','♂ オス'],['female','♀ メス'],['none','性別なし']].map(([v,n])=>`<option value="${v}" ${v===val?'selected':''}>${n}</option>`).join('');};
function matchVariantSummary(m){const parts=[];if(m.myMega?.to)parts.push(`自分：${h(m.myMega.to)}`);if(m.oppMega?.to)parts.push(`相手：${h(m.oppMega.to)}`);const opponentSex=Object.entries(m.oppGenders||{}).filter(([n,v])=>n&&v&&v!=='unknown').map(([n,v])=>h(n)+' '+displaySex(v));const mySex=Object.entries(m.myGenders||{}).filter(([n,v])=>n&&v&&v!=='unknown').map(([n,v])=>h(n)+' '+displaySex(v));if(mySex.length)parts.push('自分の性別：'+mySex.join('、'));if(opponentSex.length)parts.push('相手の性別：'+opponentSex.join('、'));return parts.length?`<p class="variant-history">確認した姿・性別：${parts.join(' ／ ')}</p>`:'';}
let dexQuery='',dexSelected='ウォッシュロトム';
function renderDex(){const names=Object.keys(FORM_DB);const term=dexQuery.normalize('NFKC').trim().toLocaleLowerCase('ja-JP');const hits=names.filter(n=>n.toLocaleLowerCase('ja-JP').includes(term)||FORM_DB[n].species.toLocaleLowerCase('ja-JP').includes(term)).sort((a,b)=>FORM_DB[a].species.localeCompare(FORM_DB[b].species,'ja')||Number(FORM_DB[a].mega)-Number(FORM_DB[b].mega));$('#tab-dex').innerHTML=`<div class="grid two"><div class="card"><h2>姿・フォルムを検索 <span class="pill">${names.length}種類を収録</span></h2><label class="field">名前検索<input id="dex-query" value="${h(dexQuery)}" placeholder="例：ロトム、メガ、イエッサン"></label><p class="help">検索ではメガシンカ後も表示。見せ合いの6匹を登録するときは、メガシンカ前の名前を選んでね。</p><div class="dex-list" id="dex-list">${dexRows(hits)}</div></div><div class="card" id="dex-detail">${formDetail(dexSelected)}<div class="line"></div><div class="group-label">同じ種類の姿</div><div class="form-options">${(FORM_GROUPS[speciesOf(dexSelected)]||[]).map(n=>`<button type="button" class="button secondary small" data-mon-detail="${h(n)}">${h(n)}</button>`).join('')}</div></div></div><p class="notice" style="margin-top:16px">このアプリの図鑑は一部のポケモンだけを収録した試作版です。レギュレーションごとの使用可否は判定していません。種族値は実際の対戦ステータスではありません。</p>`;}
function dexRows(hits){return hits.length?hits.map(n=>`<button type="button" class="dex-row ${dexSelected===n?'current':''}" data-mon-detail="${h(n)}"><span>${typeMarks(n)}<b>${h(n)}</b><small>${h(FORM_DB[n].types.join(' / '))}</small></span><span class="pill">${FORM_DB[n].stats.reduce((a,b)=>a+b,0)}</span></button>`).join(''):empty('該当する姿はありません','未収録の名前は通常の対戦記録欄で自由入力できます。');}
function matchMegaBlock(label,which,picked){const mega=draft[which]||{from:'',to:''};const available=picked.filter(n=>megasFor(n).length);let valid=available.includes(mega.from);if(!valid){mega.from='';mega.to='';}const opts=mega.from?megasFor(mega.from):[];if(mega.to&&!opts.includes(mega.to))mega.to='';return `<div class="mega-block"><div class="group-label">${label}</div><div class="form-row"><label class="field">メガシンカしたポケモン<select data-mega-from="${which}"><option value="">未確認・記録なし</option>${available.map(n=>`<option value="${h(n)}" ${n===mega.from?'selected':''}>${h(n)}</option>`).join('')}</select></label><label class="field">確認できたメガシンカ後<select data-mega-to="${which}" ${!mega.from?'disabled':''}><option value="">未確認</option>${opts.map(n=>`<option value="${h(n)}" ${n===mega.to?'selected':''}>${h(n)}</option>`).join('')}</select></label></div>${mega.to?`<div class="form-mini">${formDetail(mega.to)}</div>`:''}</div>`;}
function genderRecordBlock(){const party=data.parties.find(p=>p.id===draft.partyId);const my=draft.myPicks.map(n=>`<label class="field">${h(n)}<select data-gender-side="my" data-gender-name="${h(n)}">${genderOptions(draft.myGenders[n]||(party?.genders||[])[party.pokemon.indexOf(n)]||FORM_DB[n]?.gender||'unknown',n)}</select></label>`).join('');const opp=draft.opponentPicks.map(n=>`<label class="field">${h(n)}<select data-gender-side="opp" data-gender-name="${h(n)}">${genderOptions(draft.oppGenders[n]||FORM_DB[n]?.gender||'unknown',n)}</select></label>`).join('');return `<div class="gender-columns"><div><div class="group-label">自分の選出（性別）</div><div class="gender-list">${my||'<p class="muted small">選出を登録すると表示されます。</p>'}</div></div><div><div class="group-label">相手の確認済み選出（性別）</div><div class="gender-list">${opp||'<p class="muted small">確認した相手だけ記録できます。</p>'}</div></div></div>`;}
const originalRecord=renderRecord;
renderRecord=function(){originalRecord();if(!data.parties.length)return;const allowedMine=new Set(draft.myPicks),allowedOpp=new Set(draft.opponentPicks);if(draft.myMega?.from&&!allowedMine.has(draft.myMega.from))draft.myMega={from:'',to:''};if(draft.oppMega?.from&&!allowedOpp.has(draft.oppMega.from))draft.oppMega={from:'',to:''};$('#tab-record').insertAdjacentHTML('beforeend',`<div class="card" style="margin-top:17px"><h2>⑤ 姿・メガシンカ・性別 <span class="pill">任意</span></h2><p class="section-intro">見せ合いでは通常の名前を記録し、対戦中にメガシンカを実際に確認したらここで指定。未確認は空欄でOK。</p><div class="grid two">${matchMegaBlock('自分のメガシンカ','myMega',draft.myPicks)}${matchMegaBlock('相手のメガシンカ','oppMega',draft.opponentPicks)}</div><div class="line"></div>${genderRecordBlock()}<p class="help">性別で種族値が異なるイエッサンなどは、6匹の名前選択時に「イエッサン♂／♀」の専用候補を選ぶと、タイプ・種族値に反映されます。</p></div>`);};
const originalAnalysis=renderAnalysis;
renderAnalysis=function(){originalAnalysis();const matches=data.matches.filter(m=>analysisParty==='all'||m.partyId===analysisParty);const bySpecies=new Map(),byForm=new Map();for(const m of matches){for(const n of new Set(m.opponentPicks||[])){const sp=speciesOf(n);if(!bySpecies.has(sp))bySpecies.set(sp,{name:sp,n:0,w:0});const st=bySpecies.get(sp);st.n++;if(m.result==='win')st.w++;const target=m.oppMega?.from===n&&m.oppMega?.to?m.oppMega.to:n;if(!byForm.has(target))byForm.set(target,{name:target,n:0,w:0});const sf=byForm.get(target);sf.n++;if(m.result==='win')sf.w++;}}const order=values=>[...values].sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name,'ja')).slice(0,12);const show=rows=>rows.length?rows.map(r=>`${barrow(r.name,r.w,r.n)}${FORM_DB[r.name]?`<div class="small muted" style="margin:-8px 0 12px">${FORM_DB[r.name].types.join(' / ')}</div>`:''}`).join(''):empty('分析対象がありません','相手の確認済み選出を記録してください。');$('#tab-analysis').insertAdjacentHTML('beforeend',`<div class="grid two" style="margin-top:17px"><div class="card"><h2>種類別の勝率 <span class="pill">確認済み選出</span></h2><p class="section-intro">ロトム各フォルムなどを同じ種類として合算。未確認の選出は含みません。</p>${show(order(bySpecies.values()))}</div><div class="card"><h2>姿・メガシンカ別の勝率</h2><p class="section-intro">メガシンカが確認された試合のみ変身後に分類。未確認をメガ扱いしません。</p>${show(order(byForm.values()))}</div></div>`);};
// Change controls are non-destructive: old saved arrays and match IDs stay untouched.
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.monDetail){dexSelected=b.dataset.monDetail;setTab('dex');return;}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.partyGenderId){const party=data.parties.find(p=>p.id===t.dataset.partyGenderId);if(!party)return;const before={...party};party.genders=Array.from({length:6},(_,i)=>(party.genders||[])[i]||'unknown');party.genders[Number(t.dataset.partyGenderSlot)]=t.value;if(!saveData())Object.assign(party,before);else toast('性別の記録を保存しました');return;}
 if(t.dataset.megaFrom){const k=t.dataset.megaFrom;draft[k]={from:t.value,to:''};renderRecord();return;}
 if(t.dataset.megaTo){const k=t.dataset.megaTo;const v=draft[k];if(v&&megasFor(v.from).includes(t.value)){v.to=t.value;}else if(v){v.to='';}renderRecord();return;}
 if(t.dataset.genderSide){const side=t.dataset.genderSide==='my'?'myGenders':'oppGenders';draft[side][t.dataset.genderName]=t.value;return;}
});
document.addEventListener('input',e=>{if(e.target.id==='dex-query'){dexQuery=e.target.value;const q=dexQuery.normalize('NFKC').trim().toLocaleLowerCase('ja-JP');const rows=Object.keys(FORM_DB).filter(n=>n.toLocaleLowerCase('ja-JP').includes(q)||FORM_DB[n].species.toLocaleLowerCase('ja-JP').includes(q));$('#dex-list').innerHTML=dexRows(rows);}});

setTab('home');
</script>
